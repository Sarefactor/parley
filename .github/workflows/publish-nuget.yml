name: Publish Parley to NuGet

on:
  release:
    types: [published]

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with 'v', for example v1.2.3"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing Parley version $VERSION"

      - name: Restore solution
        run: dotnet restore Parley.slnx

      - name: Build solution
        run: >
          dotnet build Parley.slnx
          --configuration Release
          --no-restore

      - name: Test solution
        run: >
          dotnet test Parley.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Pack Parley
        shell: bash
        run: |
          dotnet pack Parley/Parley.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true

      - name: Authenticate to NuGet.org
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Parley
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done